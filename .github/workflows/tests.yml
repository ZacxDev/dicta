name: tests

on:
  push:
  pull_request:

# A second push to the same branch supersedes the first run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 17 is not optional: compileOptions / kotlinOptions pin 17, and the
      # test task's --add-opens flags are JDK 9+ module-system syntax.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # The ubuntu-latest image ships the Android SDK; AGP installs
      # compileSdk 34 / build-tools 34.0.0 from app/build.gradle.kts if missing.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      # The JUnit XML is the authority on what ran. A Gradle task can report
      # success having executed ZERO tests, and a gate that is green because it
      # measured nothing is worse than no gate — so the count is asserted, not
      # inferred from the task's exit status.
      #
      # BASELINE: 1022 against a suite of 1176 tests / 109 classes on
      # `feat/bubble-enabled-persistence` — the bubble_enabled persistence fix
      # (an app upgrade restores the bubble instead of clearing the user's
      # stored intent) plus the bubble_enabled extra on the debug CONFIGURE
      # door and its DIAGNOSE readout.
      #
      # 1176 * 500 / 575 = 1022.60 -> 1022, which is 13.10% slack.
      #
      # 🔴 COMMIT COUNTED ON: the commit this comment is part of, on
      # `feat/bubble-enabled-persistence`, whose parent is bb4356b. Counted on
      # that tree and nothing else — see the CORRECTION note below for why a
      # date does not identify a tree while a branch is moving.
      #
      # 🔴 LEFT AT 1013 THIS GATE WOULD NOT HAVE GONE RED: 1013 against 1176 is
      # 13.86% slack, inside TestCountFloorTest's 20% ceiling. Raised here
      # rather than discovered later, which is this block's own rule — the
      # ceiling exists so drift fails a test eventually, not so the floor is
      # only ever raised when it does.
      #
      # Accounted for PER CLASS against 1166 / 109, not asserted. This commit
      # only ADDS tests and no class appears or disappears:
      #   +5 ClipConfigIngressTest 11 -> 16  (the bubble_enabled happy path and
      #      its applied-string; the spelling table both ways round with the
      #      garbage half; refusal before any write; the overlay refusal; the
      #      absent-extra case)
      #   +2 BubbleEnabledWritersSeamTest 10 -> 12  (the widened src/debug scan
      #      and its own control; the ingress-names-the-key-but-cannot-reach-
      #      the-store guard. 🔴 A third, pinning how `set` writes, was WRITTEN
      #      AND THEN DELETED along with the write change it was for: the
      #      force-stop durability concern behind it was measured on hardware
      #      and not observed, so `set` still uses apply() and nothing pins the
      #      spelling. Hence +2, not +3.)
      #   +1 BootRestoreTest 6 -> 7         (the upgrade's own two guard
      #      conditions; the regression test REPLACED the test that asserted
      #      the defect, so the net is +1 and not +2)
      #   +1 ClipDiagnosticsTest 21 -> 22   (the bubbleEnabled line comes from
      #      the argument, both ways round)
      #   +1 DebugClipConfigReceiverTest 5 -> 6  (the CONFIGURE -> owner ->
      #      DIAGNOSE seam)
      #   = +10 added, -0 removed = +10 tests and +0 classes.
      #   1166 + 10 = 1176, and 109 + 0 = 109. BOTH SIDES CHECKED.
      #
      # 🔴 THE INSTRUMENT REPRODUCED THE PREVIOUS ENTRY'S ASSERTED 1166 / 109
      # EXACTLY on bb4356b, which is what makes its 1176 here worth quoting,
      # and the per-class rows above are the DIFF of that run against this
      # tree's rather than a hand tally. Cross-checked PER CLASS against the
      # JUnit XML of the scoped run for every class this change touches
      # (BootRestoreTest 7, BubbleEnabledWritersSeamTest 12,
      # ClipConfigIngressTest 16, ClipDiagnosticsTest 22,
      # ClipSeamLedgerTest 10, DebugClipConfigReceiverTest 6,
      # TestCountFloorTest 3) — identical both ways, no mismatch.
      #
      # ⚠ SourceText.kt is a file in the test source set carrying ZERO tests —
      # the hoisted strip pipeline (round 0's D5). It therefore moves the FILE
      # count (109 test classes, 110 Kotlin files there) without moving the
      # test count, which is why the class side of every reconciliation here
      # is +0 against a file that appeared. 🔴 SCOPED TO 042a669, the tree the
      # PREVIOUS entry counted on, where re-measuring per class against the
      # JUnit XML after the hoist changed `withoutComments` to replace with a
      # space rather than an empty string gave 1160 both ways with every class
      # identical — do not check that number against HEAD.
      #
      # 🔴 THE INSTRUMENT WAS POSITIVE-CONTROLLED BEFORE ITS ANSWER WAS USED.
      # The count comes from TestCountFloorTest's own `countTests` — raw
      # strings, then plain strings, then block comments, then line comments
      # stripped, in that order — reimplemented and run over BOTH trees. It
      # reproduces the asserted 1073 / 100 at d3efcd0 EXACTLY, which is what
      # makes its 1103 / 102 here worth quoting, and the per-class diff above
      # is the diff of those two runs rather than a hand tally. 🔴 Do NOT
      # count `@Test` by hand and do NOT grep for it unstripped.
      #
      # 🔴 THE PER-CLASS RECONCILIATION IS THE CHECK, AND IT DID NOT ADD UP.
      # Audit round 0 of this branch found that these line items summed to +144
      # against an asserted +151 — a seven-test hole in the one block whose own
      # comment calls the reconciliation "THE CHECK". FIVE rows understated by
      # 1 or 2 (ClipHttpTest 17 for 19, ClipPickerActivityTest 18 for 20,
      # CaptureActivityTest 11 for 12, CaptureManifestTest 11 for 12,
      # BubbleClipRevealTest 11 for 12 — all as the tree stood at 5794805), and
      # TWO modified-class absolutes were simply wrong: NetworkManifestTest was
      # given as 14 -> 15 against a real 9 -> 10, and FloatingWindowSizeTest as
      # 12 -> 16 against a real 13 -> 17. 🔴 Both of those DELTAS were right,
      # which is exactly why nothing noticed: the sum of the deltas is what the
      # total is built from, and a wrong pair of absolutes is invisible to it.
      # The asserted floor and total were both correct, so CI never saw any of
      # it — the cost was entirely to the next maintainer, who reconciles their
      # own entry from these numbers.
      #
      # 🔴 EVERY ROW IN A RECONCILIATION IS RE-DERIVED FROM THE TREE, and the
      # total is NOT adjusted to match the rows. The instrument is
      # TestCountFloorTest's own `countTests`, validated in both directions by
      # `bothInstrumentsAreValidated`. 🔴 Do NOT count `@Test` by hand and do
      # NOT grep for it unstripped: this file's history records a hand count
      # of 29 against an XML 28, and an unstripped grep reading 1053 against
      # the same tree's real 1052. (The 1052 / 99 figures this paragraph used
      # to quote for commit 5794805 are deleted rather than re-derived against
      # whatever tree is checked out — which is the rule the CORRECTION note
      # below states about numbers that have gone out of scope.)
      #
      # 🔴 PREVIOUS-ENTRY CHAIN TRIMMED TO THREE. Round 0 of #46's audit raised
      # that this block had grown an append-only chain of nine historical
      # derivations with no eviction rule, so it grew every time the suite did.
      # The three most recent are kept — enough to see the trend and to check
      # the arithmetic convention — and the older ones are in `git log` for this
      # file, which is where a full history belongs. Do not re-grow it: add your
      # entry and drop the oldest.
      #
      # It was --min 3, which could only ever catch a collapse to almost
      # literally nothing: against this suite 3 IS the "handful" the old comment
      # claimed to catch, so the gate read as coverage while providing nearly
      # none. The ~13% headroom is deliberate — it tolerates deleting a class
      # during a refactor without tolerating a partial collapse.
      #
      # 🔴 THE HEADROOM IS THE CONSTANT, NOT THE FLOOR — re-derive it, do not
      # pick a round number:
      #     floor = floor(current_total * 500 / 575)      # 0.86957, 13.04% slack
      # 1176 * 500 / 575 = 1022.60 -> 1022, which is 13.10% slack.
      #
      # 🔴 NAME THE TREE YOU COUNTED ON, not just the date. Past entries were
      # raised several-per-day, so a date does not identify a tree while a
      # branch is moving — the CORRECTION note below is entirely about why.
      # Restated here because the trim deleted the line that carried it: it is
      # an INSTRUCTION, not a history entry, and losing it was a mistake.
      #
      # 🔴 THREE PREVIOUS ENTRIES, AND NO MORE — see the trim note at the top of
      # this block. Add yours, drop the oldest; `git log -p -- <this file>` has
      # the rest.
      # (Previous entries: 1166 * 500 / 575 = 1013.91 -> 1013, 13.12% slack;
      #  1160 * 500 / 575 = 1008.69 -> 1008, 13.10% slack;
      #  1159 * 500 / 575 = 1007.83 -> 1007, 13.11% slack.)
      # 1103 -> 959 was DROPPED as the oldest when this entry was added, along
      # with the detailed SnipUsageStore entry (901 -> 783) that the trim rule
      # had already left behind above the previous-entries list. That is the
      # eviction rule this block states. The full history is in this file's own
      # log.
      #
      # 🔴 CORRECTION (2026-10-23). This block used to say the previous entry
      # "was left alone while the suite grew to 623, drifting the slack to 20%".
      # Both numbers were TRUE WHEN WRITTEN and both were stale by the time they
      # shipped: the suite really was 623 at commits 0544fa2 / 32b089c of this
      # branch, where 500 against 623 is 19.7% slack — and then 723c21d deleted
      # the bubble's refusal apparatus, four tests went with it, and this
      # comment was never touched. The "500 against 575 (2026-10-17)" entry it
      # describes was CORRECT: 575 is the count at 51faf83, the commit that
      # raised the floor. So the drift it complains about was real and the
      # instruction below is right. What was wrong is subtler and worth more: a
      # count measured on one commit of a moving branch was quoted on another.
      # THEREFORE, when the suite grows: recompute BOTH numbers, restate the
      # baseline on the first line above, and say WHICH TREE you counted on —
      # a date does not identify a tree while a branch is moving. If you LOWER
      # it, say why in the commit, because lowering it is how this gate goes
      # quietly back to being decorative.
      #
      # The baseline is no longer only a comment: TestCountFloorTest asserts
      # that this floor is not above the suite and that the slack has not
      # drifted past 20%, so the next drift fails a test instead of sitting
      # here unread. It also pins that android.nix does NOT restate the count —
      # that second copy is the one that went stale, and one number belongs in
      # one place.
      - name: Assert tests actually ran
        if: always()
        run: python3 scripts/assert-tests-ran.py --min 1022

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

      # 🔴 A THROWAWAY KEY, FOR A BUILD THAT IS NEVER PUBLISHED.
      #
      # app/build.gradle.kts declares the debug signing config EXPLICITLY, so
      # AGP no longer auto-generates ~/.android/debug.keystore when it is
      # missing — `validateSigningDebug` FAILS instead. That fail-closed
      # behaviour is the point of declaring it (an auto-generated key is how a
      # release gets signed with a certificate the handset will refuse), but it
      # means this workflow, which has no keystore and deliberately no access to
      # the release secret, must supply one of its own.
      #
      # Measured, not predicted: without this step the "Assemble debug APK"
      # step below failed with
      #   Keystore file '/home/runner/.android/debug.keystore' not found
      #           for signing config 'debug'
      # on a runner, while the same build was green locally — the local host has
      # that file. One measurement was not a general claim.
      #
      # The identity is irrelevant HERE and must stay irrelevant: this APK is a
      # packaging check, never an artifact anyone installs. Releases are built
      # by release.yml from the real keystore, and the signer fingerprint is
      # gated there. Generating the key rather than reusing the real one is
      # deliberate — it keeps the operator's keystore out of a workflow that
      # runs on every push and on pull requests from anywhere.
      - name: Mint a throwaway debug keystore
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -keystore "${RUNNER_TEMP}/throwaway-debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 1 \
            -dname 'C=US, O=Android, CN=Android Debug throwaway CI key'

      - name: Assemble debug APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon \
            -Pdicta.debugKeystore="${RUNNER_TEMP}/throwaway-debug.keystore"

      # 🔴 COMPILES androidTest, which neither task above does. Without this
      # step the instrumentation source set is structurally invisible to the
      # gate: widening an interface that LiveServiceDeviceTest overrides —
      # TranscriptionCoordinator.Events.onRemoteTranscript went from 1 to 3
      # parameters in this repo's history — leaves CI fully green while the
      # breakage waits for the next manual device pass.
      #
      # Compiles only; it does NOT run the device tests. Those hit the live
      # service and need a token at /data/local/tmp plus mesh reachability,
      # neither of which a GitHub runner has.
      - name: Compile instrumentation tests
        run: |
          ./gradlew :app:assembleDebugAndroidTest --no-daemon \
            -Pdicta.debugKeystore="${RUNNER_TEMP}/throwaway-debug.keystore"
