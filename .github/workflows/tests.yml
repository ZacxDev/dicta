name: tests

on:
  push:
  pull_request:

# A second push to the same branch supersedes the first run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 17 is not optional: compileOptions / kotlinOptions pin 17, and the
      # test task's --add-opens flags are JDK 9+ module-system syntax.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # The ubuntu-latest image ships the Android SDK; AGP installs
      # compileSdk 34 / build-tools 34.0.0 from app/build.gradle.kts if missing.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      # The JUnit XML is the authority on what ran. A Gradle task can report
      # success having executed ZERO tests, and a gate that is green because it
      # measured nothing is worse than no gate — so the count is asserted, not
      # inferred from the task's exit status.
      #
      # BASELINE: 605 against a suite of 696 tests / 65 classes, read from the
      # JUnit XML of a full run on `main` at ebffaf9 (2026-10-26) — the tip
      # after #33 deleted the reachability probe's backoff and two ledger
      # tests. 696/65 was measured directly (65 TEST-*.xml files summing to
      # tests=696 failures=0 errors=0 skipped=0) and agrees with
      # scripts/assert-tests-ran.py's own TOTAL line on the same run.
      #
      # 🔴 THE FLOOR WAS LAGGING THE SUITE, WHICH IS WHY THIS RAISES IT. The
      # entry below is CORRECT about the tree it names and was never wrong;
      # what went stale is this gate's floor, because the rule further down
      # makes the HEADROOM the constant and the suite has moved since. The
      # intervening history, so nobody reads this as one jump: the suite
      # reached 699/65 (#30, the tile-add outcomes), then 701/65 (#32, the
      # audit-round-1 fixes), then 696/65 (#33, the two deletions). At 701 the
      # formula prescribed 609; the gate said 600 throughout. Re-derived here
      # rather than carried forward.
      #
      # PREVIOUS ENTRY: 600 against a suite of 691 tests / 63 classes, measured
      # from the JUnit XML of a full run on feat/stt-reachability-precheck
      # (2026-10-23) — the reachability pre-check stacked on 433fbc8, the tip
      # of feat/ui-surface-cleanup, which is itself stacked on ae1b464
      # (feat/bubble-state-tile-boot). That is the tree this number is about
      # and no other: this is a three-deep stack and each branch adds test
      # classes the ones below it do not have, so no lower branch's count
      # applies here. It reconciles as 651/60 at 433fbc8 plus this branch's
      # +40 tests / +3 classes (SttReachabilityTest,
      # SttReachabilityLedgerTest, BubbleUnreachableWarningTest).
      #
      # 🔴 COMMITS COUNTED ON, since a branch is not a tree: 691/63 was read
      # from the XML at 11f2a9c (the commit that adds the feature) and read
      # again, unchanged, at 65e6f7b (the last of the four follow-ups that
      # close the mutation-sweep findings and retract two prose claims). Those
      # follow-ups delete one production line, add no test and remove none, so
      # the count is constant across this branch — stated because "measured on
      # the branch" is exactly the imprecision the correction note below is
      # about.
      #
      # The previous entries said "566 against 651 / 60" at the rebased tip of
      # feat/ui-surface-cleanup, "554 against 638 / 58" at ae1b464 and, before
      # that, "550 against 633 / 57" at ce38e39 — several of them on the same
      # day, which is exactly why the date alone does not identify the tree.
      # 🔴 NAME THE TREE YOU COUNTED ON, not just the date — the correction
      # note below is entirely about why.
      #
      # It was --min 3, which could only ever catch a collapse to almost
      # literally nothing: against this suite 3 IS the "handful" the old comment
      # claimed to catch, so the gate read as coverage while providing nearly
      # none. The ~13% headroom is deliberate — it tolerates deleting a class
      # during a refactor without tolerating a partial collapse.
      #
      # 🔴 THE HEADROOM IS THE CONSTANT, NOT THE FLOOR — re-derive it, do not
      # pick a round number:
      #     floor = floor(current_total * 500 / 575)      # 0.86957, 13.04% slack
      # 696 * 500 / 575 = 605.22 -> 605, which is 13.07% slack.
      # (Previous entries: 691 * 500 / 575 = 600.87 -> 600, 13.17% slack;
      #  651 * 500 / 575 = 566.09 -> 566, 13.06% slack;
      #  638 * 500 / 575 = 554.78 -> 554, 13.17% slack;
      #  633 * 500 / 575 = 550.43 -> 550, 13.11% slack.)
      #
      # 🔴 CORRECTION (2026-10-23). This block used to say the previous entry
      # "was left alone while the suite grew to 623, drifting the slack to 20%".
      # Both numbers were TRUE WHEN WRITTEN and both were stale by the time they
      # shipped: the suite really was 623 at commits 0544fa2 / 32b089c of this
      # branch, where 500 against 623 is 19.7% slack — and then 723c21d deleted
      # the bubble's refusal apparatus, four tests went with it, and this
      # comment was never touched. The "500 against 575 (2026-10-17)" entry it
      # describes was CORRECT: 575 is the count at 51faf83, the commit that
      # raised the floor. So the drift it complains about was real and the
      # instruction below is right. What was wrong is subtler and worth more: a
      # count measured on one commit of a moving branch was quoted on another.
      # THEREFORE, when the suite grows: recompute BOTH numbers, restate the
      # baseline on the first line above, and say WHICH TREE you counted on —
      # a date does not identify a tree while a branch is moving. If you LOWER
      # it, say why in the commit, because lowering it is how this gate goes
      # quietly back to being decorative.
      #
      # The baseline is no longer only a comment: TestCountFloorTest asserts
      # that this floor is not above the suite and that the slack has not
      # drifted past 20%, so the next drift fails a test instead of sitting
      # here unread. It also pins that android.nix does NOT restate the count —
      # that second copy is the one that went stale, and one number belongs in
      # one place.
      - name: Assert tests actually ran
        if: always()
        run: python3 scripts/assert-tests-ran.py --min 605

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

      # 🔴 A THROWAWAY KEY, FOR A BUILD THAT IS NEVER PUBLISHED.
      #
      # app/build.gradle.kts declares the debug signing config EXPLICITLY, so
      # AGP no longer auto-generates ~/.android/debug.keystore when it is
      # missing — `validateSigningDebug` FAILS instead. That fail-closed
      # behaviour is the point of declaring it (an auto-generated key is how a
      # release gets signed with a certificate the handset will refuse), but it
      # means this workflow, which has no keystore and deliberately no access to
      # the release secret, must supply one of its own.
      #
      # Measured, not predicted: without this step the "Assemble debug APK"
      # step below failed with
      #   Keystore file '/home/runner/.android/debug.keystore' not found
      #           for signing config 'debug'
      # on a runner, while the same build was green locally — the local host has
      # that file. One measurement was not a general claim.
      #
      # The identity is irrelevant HERE and must stay irrelevant: this APK is a
      # packaging check, never an artifact anyone installs. Releases are built
      # by release.yml from the real keystore, and the signer fingerprint is
      # gated there. Generating the key rather than reusing the real one is
      # deliberate — it keeps the operator's keystore out of a workflow that
      # runs on every push and on pull requests from anywhere.
      - name: Mint a throwaway debug keystore
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -keystore "${RUNNER_TEMP}/throwaway-debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 1 \
            -dname 'C=US, O=Android, CN=Android Debug throwaway CI key'

      - name: Assemble debug APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon \
            -Pdicta.debugKeystore="${RUNNER_TEMP}/throwaway-debug.keystore"

      # 🔴 COMPILES androidTest, which neither task above does. Without this
      # step the instrumentation source set is structurally invisible to the
      # gate: widening an interface that LiveServiceDeviceTest overrides —
      # TranscriptionCoordinator.Events.onRemoteTranscript went from 1 to 3
      # parameters in this repo's history — leaves CI fully green while the
      # breakage waits for the next manual device pass.
      #
      # Compiles only; it does NOT run the device tests. Those hit the live
      # service and need a token at /data/local/tmp plus mesh reachability,
      # neither of which a GitHub runner has.
      - name: Compile instrumentation tests
        run: |
          ./gradlew :app:assembleDebugAndroidTest --no-daemon \
            -Pdicta.debugKeystore="${RUNNER_TEMP}/throwaway-debug.keystore"
