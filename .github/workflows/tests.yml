name: tests

on:
  push:
  pull_request:

# A second push to the same branch supersedes the first run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 17 is not optional: compileOptions / kotlinOptions pin 17, and the
      # test task's --add-opens flags are JDK 9+ module-system syntax.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # The ubuntu-latest image ships the Android SDK; AGP installs
      # compileSdk 34 / build-tools 34.0.0 from app/build.gradle.kts if missing.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      # The JUnit XML is the authority on what ran. A Gradle task can report
      # success having executed ZERO tests, and a gate that is green because it
      # measured nothing is worse than no gate — so the count is asserted, not
      # inferred from the task's exit status.
      #
      # BASELINE: 550 against a suite of 633 tests / 57 classes, measured from
      # the JUnit XML of a full run at the head of feat/bubble-state-tile-boot
      # (2026-10-23). 🔴 NAME THE TREE YOU COUNTED ON, not just the date — the
      # correction note below is entirely about why.
      #
      # It was --min 3, which could only ever catch a collapse to almost
      # literally nothing: against this suite 3 IS the "handful" the old comment
      # claimed to catch, so the gate read as coverage while providing nearly
      # none. The ~13% headroom is deliberate — it tolerates deleting a class
      # during a refactor without tolerating a partial collapse.
      #
      # 🔴 THE HEADROOM IS THE CONSTANT, NOT THE FLOOR — re-derive it, do not
      # pick a round number:
      #     floor = floor(current_total * 500 / 575)      # 0.86957, 13.04% slack
      # 633 * 500 / 575 = 550.43 -> 550, which is 13.11% slack.
      #
      # 🔴 CORRECTION (2026-10-23). This block used to say the previous entry
      # "was left alone while the suite grew to 623, drifting the slack to 20%".
      # Both numbers were TRUE WHEN WRITTEN and both were stale by the time they
      # shipped: the suite really was 623 at commits 0544fa2 / 32b089c of this
      # branch, where 500 against 623 is 19.7% slack — and then 723c21d deleted
      # the bubble's refusal apparatus, four tests went with it, and this
      # comment was never touched. The "500 against 575 (2026-10-17)" entry it
      # describes was CORRECT: 575 is the count at 51faf83, the commit that
      # raised the floor. So the drift it complains about was real and the
      # instruction below is right. What was wrong is subtler and worth more: a
      # count measured on one commit of a moving branch was quoted on another.
      # THEREFORE, when the suite grows: recompute BOTH numbers, restate the
      # baseline on the first line above, and say WHICH TREE you counted on —
      # a date does not identify a tree while a branch is moving. If you LOWER
      # it, say why in the commit, because lowering it is how this gate goes
      # quietly back to being decorative.
      #
      # The baseline is no longer only a comment: TestCountFloorTest asserts
      # that this floor is not above the suite and that the slack has not
      # drifted past 20%, so the next drift fails a test instead of sitting
      # here unread. It also pins that android.nix does NOT restate the count —
      # that second copy is the one that went stale, and one number belongs in
      # one place.
      - name: Assert tests actually ran
        if: always()
        run: python3 scripts/assert-tests-ran.py --min 550

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      # 🔴 COMPILES androidTest, which neither task above does. Without this
      # step the instrumentation source set is structurally invisible to the
      # gate: widening an interface that LiveServiceDeviceTest overrides —
      # TranscriptionCoordinator.Events.onRemoteTranscript went from 1 to 3
      # parameters in this repo's history — leaves CI fully green while the
      # breakage waits for the next manual device pass.
      #
      # Compiles only; it does NOT run the device tests. Those hit the live
      # service and need a token at /data/local/tmp plus mesh reachability,
      # neither of which a GitHub runner has.
      - name: Compile instrumentation tests
        run: ./gradlew :app:assembleDebugAndroidTest --no-daemon
