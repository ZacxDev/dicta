org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.nonTransitiveRClass=true
# Robolectric pulls androidx.test:monitor transitively on the UNIT TEST
# classpath. AGP refuses to resolve any AndroidX coordinate without this flag,
# even when it is test-only. Nothing AndroidX reaches the APK — the app's
# `implementation` set is still empty (see app/build.gradle.kts).
android.useAndroidX=true
kotlin.code.style=official
